basePath: /
definitions:
  dto.LoginRequest:
    properties:
      email:
        default: user@example.com
        type: string
      password:
        default: password123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.OTPRequest:
    properties:
      email:
        default: user@example.com
        type: string
    required:
    - email
    type: object
  dto.RegisterRequest:
    properties:
      address:
        default: 123 Main Street, City, Country
        type: string
      bio:
        default: User bio description
        type: string
      country:
        default: India
        type: string
      email:
        default: user@example.com
        type: string
      password:
        default: password123
        minLength: 8
        type: string
      phone:
        default: "+1234567890"
        type: string
      username:
        default: user123
        type: string
    required:
    - address
    - country
    - email
    - password
    - phone
    - username
    type: object
  dto.VerifyOTPRequest:
    properties:
      email:
        default: user@example.com
        type: string
      otp:
        default: 123456
        maximum: 999999
        minimum: 100000
        type: integer
    required:
    - email
    - otp
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_verified:
        description: Email verification status
        type: boolean
      status:
        allOf:
        - $ref: '#/definitions/models.UserStatus'
        description: Account status
      type:
        allOf:
        - $ref: '#/definitions/models.UserType'
        description: 'Role: user/admin'
      updated_at:
        type: string
      userdata:
        allOf:
        - $ref: '#/definitions/models.UserData'
        description: One-to-One relationship
      username:
        type: string
    type: object
  models.UserData:
    properties:
      address:
        type: string
      bio:
        type: string
      country:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      phone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.UserStatus:
    enum:
    - active
    - inactive
    - suspended
    - pending
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusInactive
    - UserStatusSuspended
    - UserStatusPending
  models.UserType:
    enum:
    - admin
    - moderator
    - user
    - guest
    type: string
    x-enum-varnames:
    - UserTypeAdmin
    - UserTypeModerator
    - UserTypeUser
    - UserTypeGuest
host: localhost:8000
info:
  contact:
    email: support@ntmonitor.com
    name: API Support
  description: API documentation for NTMonitor application
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: NTMonitor API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Log out the authenticated user by destroying the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User logout
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and profile data. Requires JWT token
        from OTP verification.
      parameters:
      - description: Registration Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a new user
      tags:
      - auth
  /api/auth/send-otp:
    post:
      consumes:
      - application/json
      description: Generate and send a one-time password to the user's email address
      parameters:
      - description: Email Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send OTP to user email
      tags:
      - auth
  /api/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the one-time password sent to user's email
      parameters:
      - description: OTP Verification Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP
      tags:
      - auth
  /api/users:
    get:
      description: Retrieve a list of all users. Requires admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get all users (Admin only)
      tags:
      - users
  /api/users/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a user by their unique ID. Users can only view their own
        profile unless they are admin.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get user by ID
      tags:
      - users
  /api/users/get-me:
    get:
      description: Retrieve the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get Me
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
  SessionAuth:
    description: Session token for authenticated requests.
    in: cookie
    name: session_token
    type: apiKey
swagger: "2.0"
