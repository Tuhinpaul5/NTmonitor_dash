basePath: /
definitions:
  dto.RegisterRequest:
    properties:
      address:
        default: 123 Main Street, City, Country
        type: string
      bio:
        default: User bio description
        type: string
      country:
        default: India
        type: string
      email:
        default: user@example.com
        type: string
      password:
        default: password123
        minLength: 8
        type: string
      phone:
        default: "+1234567890"
        type: string
      username:
        default: user123
        type: string
    required:
    - address
    - country
    - email
    - password
    - phone
    - username
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_verified:
        description: Email verification status
        type: boolean
      status:
        allOf:
        - $ref: '#/definitions/models.UserStatus'
        description: Account status
      type:
        allOf:
        - $ref: '#/definitions/models.UserType'
        description: 'Role: user/admin'
      updated_at:
        type: string
      userdata:
        allOf:
        - $ref: '#/definitions/models.UserData'
        description: One-to-One relationship
      username:
        type: string
    type: object
  models.UserData:
    properties:
      address:
        type: string
      bio:
        type: string
      country:
        type: string
      created_at:
        type: string
      id:
        type: integer
      ip:
        type: string
      phone:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.UserStatus:
    enum:
    - active
    - inactive
    - suspended
    - pending
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusInactive
    - UserStatusSuspended
    - UserStatusPending
  models.UserType:
    enum:
    - admin
    - moderator
    - user
    - guest
    type: string
    x-enum-varnames:
    - UserTypeAdmin
    - UserTypeModerator
    - UserTypeUser
    - UserTypeGuest
host: localhost:8000
info:
  contact:
    email: support@ntmonitor.com
    name: API Support
  description: API documentation for NTMonitor application
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: NTMonitor API
  version: "1.0"
paths:
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and profile data
      parameters:
      - description: Registration Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /api/users:
    get:
      description: Retrieve a list of all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user with email and profile data
      parameters:
      - description: User object
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - users
  /api/users/id/{id}:
    get:
      description: Retrieve a single user by their ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
swagger: "2.0"
